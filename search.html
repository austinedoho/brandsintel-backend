<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands Track - Verify Nigerian Businesses Instantly</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        .content {
            padding: 40px 30px;
        }

        .search-container {
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-box button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .results-container {
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .company-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .company-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.1);
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .company-name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .company-industry {
            color: #667eea;
            font-size: 14px;
            margin-top: 5px;
        }

        .badge-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge.verified {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge.premium {
            background: #fff3e0;
            color: #e65100;
        }

        .badge.trust-score {
            background: #e3f2fd;
            color: #1565c0;
        }

        .company-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .detail-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .company-description {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #764ba2;
            margin-bottom: 20px;
        }

        .description-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .description-text {
            color: #1a1a1a;
            font-size: 15px;
            line-height: 1.6;
        }

        /* ============ NEWS SECTION STYLES ============ */
        .news-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
        }

        .news-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .news-title {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .news-summary {
            display: flex;
            gap: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .summary-stat {
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-weight: 600;
            color: #667eea;
        }

        .news-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .news-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            margin-bottom: 10px;
        }

        .news-item-free {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .news-item-free .news-item-title {
            color: #999;
            font-size: 13px;
        }

        .news-item-premium {
            border-left: 3px solid #28a745;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .news-item-premium:hover {
            background: #e8f5e9;
            border-left: 3px solid #28a745;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.1);
        }

        .news-item-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .news-item-title {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .news-link-icon {
            font-size: 12px;
            opacity: 0.6;
        }

        .news-item-premium:hover .news-link-icon {
            opacity: 1;
            color: #28a745;
        }

        .news-item-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 11px;
        }

        .news-item-source {
            color: #667eea;
            font-weight: 600;
        }

        .news-item-date {
            color: #999;
        }

        .sentiment-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
        }

        .sentiment-positive {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .sentiment-negative {
            background: #ffebee;
            color: #c62828;
        }

        .sentiment-neutral {
            background: #f5f5f5;
            color: #666;
        }

        .news-empty {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        /* PREMIUM UPGRADE CTA - shown to FREE users */
        .news-upgrade-cta {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .cta-icon {
            font-size: 24px;
        }

        .cta-text {
            flex: 1;
            min-width: 200px;
        }

        .cta-text strong {
            display: block;
            color: #1a1a1a;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .cta-text p {
            font-size: 12px;
            color: #666;
            margin: 0;
        }

        .news-upgrade-cta .btn {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-premium {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 200, 0, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .company-header {
                flex-direction: column;
            }

            .company-details {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .badge-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Brands Track</h1>
            <p>Verify Nigerian Businesses Instantly</p>
        </div>

        <div class="content">
            <div class="search-container">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search company name, CAC number, or phone..."
                        onkeypress="if(event.key === 'Enter') performSearch()"
                    >
                    <button onclick="performSearch()">Search</button>
                </div>
            </div>

            <div class="results-container" id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://brandsintel-backend.onrender.com';

        // ============ CREATE NEWS SECTION WITH PROPER CTA LOGIC ============
        function createNewsSection(company) {
            const isPremium = company.is_premium === true;
            const news = company.news || [];
            const newsSummary = company.news_summary || {};

            // If no news, show empty state
            if (!news || news.length === 0) {
                return `
                    <div class="news-section">
                        <div class="news-title">📰 Latest News</div>
                        <div class="news-empty">No news available yet for this company</div>
                    </div>
                `;
            }

            // Build news items
            let newsItemsHTML = '';
            news.forEach((article) => {
                const sentimentBadgeClass = article.sentiment === 'positive' 
                    ? 'sentiment-positive' 
                    : article.sentiment === 'negative' 
                    ? 'sentiment-negative' 
                    : 'sentiment-neutral';

                const sentimentEmoji = article.sentiment === 'positive' 
                    ? '📈 Positive' 
                    : article.sentiment === 'negative' 
                    ? '📉 Negative' 
                    : '➡️ Neutral';

                if (isPremium) {
                    // PREMIUM USER: Clickable link
                    newsItemsHTML += `
                        <div class="news-item news-item-premium">
                            <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="news-item-link">
                                <div class="news-item-title">
                                    ${article.title}
                                    <span class="news-link-icon">🔗</span>
                                </div>
                            </a>
                            <div class="news-item-meta">
                                <span class="news-item-source">${article.source}</span>
                                <span class="news-item-date">${new Date(article.published_date).toLocaleDateString()}</span>
                                <span class="sentiment-badge ${sentimentBadgeClass}">${sentimentEmoji}</span>
                            </div>
                        </div>
                    `;
                } else {
                    // FREE USER: Greyed out, not clickable
                    newsItemsHTML += `
                        <div class="news-item news-item-free">
                            <div class="news-item-title">${article.title}</div>
                            <div class="news-item-meta">
                                <span class="news-item-source">${article.source}</span>
                                <span class="news-item-date">${new Date(article.published_date).toLocaleDateString()}</span>
                                <span class="sentiment-badge ${sentimentBadgeClass}">${sentimentEmoji}</span>
                            </div>
                        </div>
                    `;
                }
            });

            // Build news section HTML
            let newsHTML = `
                <div class="news-section">
                    <div class="news-section-header">
                        <div class="news-title">📰 Market Intelligence</div>
            `;

            if (newsSummary && newsSummary.total_articles > 0) {
                newsHTML += `
                    <div class="news-summary">
                        <span class="summary-stat">🔥 ${newsSummary.total_articles} articles</span>
                        <span class="summary-stat">📈 ${newsSummary.positive_percentage}% positive</span>
                    </div>
                `;
            }

            newsHTML += `
                    </div>
                    <div class="news-items">
                        ${newsItemsHTML}
                    </div>
            `;

            // CRITICAL: Show upgrade CTA ONLY if FREE user (isPremium === false)
            if (!isPremium) {
                newsHTML += `
                    <div class="news-upgrade-cta">
                        <div class="cta-icon">🔒</div>
                        <div class="cta-text">
                            <strong>Unlock Full Articles</strong>
                            <p>Premium members can click and read full articles from trusted news sources</p>
                        </div>
                        <button class="btn btn-premium" onclick="startPremiumCheckout('${company.cac_number}', '${company.name}')">
                            ⭐ Upgrade - ₦30K/month
                        </button>
                    </div>
                `;
            }

            newsHTML += `</div>`;
            return newsHTML;
        }

        async function performSearch() {
            const searchInput = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('resultsContainer');

            if (!searchInput) {
                resultsContainer.innerHTML = '<div style="color: red; padding: 20px;">Please enter a company name or CAC number</div>';
                return;
            }

            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Searching for company information...</div>';

            try {
                const response = await fetch(`${BACKEND_URL}/api/companies/search?q=${encodeURIComponent(searchInput)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    resultsContainer.innerHTML = data.results.map(company => createCompanyCard(company)).join('');
                } else {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <h3>No results found</h3>
                            <p>Try searching with a different company name or CAC number</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = `
                    <div style="color: red; padding: 20px;">
                        <strong>Error:</strong> Unable to fetch results. Please try again later.
                    </div>
                `;
            }
        }

        function createCompanyCard(company) {
            const trustScore = company.trust_score || 0;
            const isPremium = company.is_premium === true;

            let html = `
                <div class="company-card">
                    <div class="company-header">
                        <div>
                            <div class="company-name">${company.name || 'Unknown'}</div>
                            <div class="company-industry">${company.industry || 'Not specified'}</div>
                        </div>
                        <div class="badge-group">
            `;

            if (company.verification_status === 'verified') {
                html += `<span class="badge verified">✓ CAC Verified</span>`;
            }

            html += `
                            <span class="badge trust-score">Trust Score: ${trustScore}/100</span>
            `;

            if (isPremium) {
                html += `<span class="badge premium">⭐ Premium</span>`;
            }

            html += `
                        </div>
                    </div>
            `;

            if (company.description) {
                html += `
                    <div class="company-description">
                        <div class="description-label">Description</div>
                        <div class="description-text">${company.description}</div>
                    </div>
                `;
            }

            html += `<div class="company-details">`;

            if (company.cac_number) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">CAC Number</div>
                        <div class="detail-value">${company.cac_number}</div>
                    </div>
                `;
            }

            if (company.address) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Location</div>
                        <div class="detail-value">${company.address}</div>
                    </div>
                `;
            }

            if (company.employees) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Employees</div>
                        <div class="detail-value">${company.employees}</div>
                    </div>
                `;
            }

            if (company.founded) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Founded</div>
                        <div class="detail-value">${company.founded}</div>
                    </div>
                `;
            }

            if (company.email) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Email</div>
                        <div class="detail-value"><a href="mailto:${company.email}" style="color: #667eea; text-decoration: none;">${company.email}</a></div>
                    </div>
                `;
            }

            if (company.phone) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Phone</div>
                        <div class="detail-value"><a href="tel:${company.phone}" style="color: #667eea; text-decoration: none;">${company.phone}</a></div>
                    </div>
                `;
            }

            if (company.website) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">Website</div>
                        <div class="detail-value"><a href="${company.website}" target="_blank" style="color: #667eea; text-decoration: none;">${company.website}</a></div>
                    </div>
                `;
            }

            html += `</div>`;

            // ADD NEWS SECTION WITH PROPER CTA
            html += createNewsSection(company);

            html += `
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="saveCompany('${company.name}')">💾 Save</button>
                        <button class="btn btn-primary" onclick="shareCompany('${company.name}')">🔗 Share</button>
            `;

            if (!isPremium) {
                html += `
                    <button class="btn btn-premium" onclick="startPremiumCheckout('${company.cac_number}', '${company.name}')">⭐ Upgrade - ₦30K/month</button>
                `;
            }

            html += `</div></div>`;

            return html;
        }

        function saveCompany(companyName) {
            alert(`${companyName} saved to your watchlist!`);
        }

        function shareCompany(companyName) {
            const text = `Check out ${companyName} on Brands Track - verified business intelligence platform`;
            if (navigator.share) {
                navigator.share({
                    title: 'Brands Track',
                    text: text
                });
            } else {
                alert('Share: ' + text);
            }
        }

        function startPremiumCheckout(cacNumber, companyName) {
            alert(`Starting premium checkout for ${companyName}... (CAC: ${cacNumber})\n\nPremium Features:\n✅ Full financial history\n✅ Fraud risk analysis\n✅ Click to read full articles\n✅ Email support\n✅ Certified reports`);
        }

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                document.getElementById('searchInput').value = query;
                performSearch();
            }
        });
    </script>
</body>
</html>
