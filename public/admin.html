<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandsTrack Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #1a202c;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 0.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            opacity: 0.95;
            font-size: 0.95rem;
        }

        .login-section {
            background: white;
            padding: 2rem;
            border-radius: 0.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .login-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a202c;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-logout {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .btn-logout:hover {
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .dashboard {
            display: none;
        }

        .dashboard.show {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 0.8rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f1f3;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #1a202c;
        }

        .card.highlight {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 500;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f1f3;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-name {
            font-weight: 600;
            color: #1a202c;
            font-size: 0.95rem;
        }

        .setting-value {
            color: #667eea;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }

        .alert-error {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
        }

        .alert-info {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            color: #1565c0;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings-form {
            display: grid;
            gap: 1.5rem;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ BrandsTrack Admin Dashboard</h1>
            <p>Manage pricing, settings, and Paystack integration</p>
        </header>

        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <h2>Admin Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Backend URL</label>
                    <input type="url" id="backendUrl" placeholder="https://brandsintel-backend.onrender.com" value="https://brandsintel-backend.onrender.com" required>
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminKey" placeholder="Enter admin password" required>
                </div>
                <button type="submit">🔓 Login to Dashboard</button>
            </form>
        </div>

        <!-- Alerts -->
        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-info" id="infoAlert"></div>

        <!-- Dashboard Section -->
        <div class="dashboard" id="dashboard">
            <div class="button-group" style="margin-bottom: 2rem;">
                <button class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
            </div>

            <!-- Stats Overview -->
            <div class="grid">
                <div class="card highlight">
                    <div class="stat-value" id="priceValue">₦30,000</div>
                    <div class="stat-label">Premium Monthly Price</div>
                </div>
                <div class="card">
                    <div class="stat-value" id="searchValue">3</div>
                    <div class="stat-label">Free Searches per Day</div>
                </div>
                <div class="card">
                    <div class="stat-value" id="articlesValue">9</div>
                    <div class="stat-label">Articles per Company</div>
                </div>
            </div>

            <!-- Settings Editor -->
            <div class="card">
                <h2>⚙️ Edit Settings</h2>
                <form class="settings-form" onsubmit="handleUpdateSettings(event)">
                    <div class="form-group">
                        <label>Premium Monthly Price (₦)</label>
                        <input type="number" id="premiumPrice" min="1000" step="1000" required>
                    </div>

                    <div class="form-group">
                        <label>Free Searches per Day</label>
                        <input type="number" id="freeSearues" min="1" max="10" required>
                    </div>

                    <div class="form-group">
                        <label>Articles per Company</label>
                        <input type="number" id="articlesPerCompany" min="3" max="20" required>
                    </div>

                    <div class="toggle">
                        <input type="checkbox" id="featuredEnabled" class="checkbox">
                        <label for="featuredEnabled" style="margin: 0; cursor: pointer;">Featured Listing Enabled</label>
                    </div>

                    <div class="toggle">
                        <input type="checkbox" id="reviewsEnabled" class="checkbox">
                        <label for="reviewsEnabled" style="margin: 0; cursor: pointer;">Customer Reviews Enabled</label>
                    </div>

                    <div class="toggle">
                        <input type="checkbox" id="apiEnabled" class="checkbox">
                        <label for="apiEnabled" style="margin: 0; cursor: pointer;">API Access Enabled</label>
                    </div>

                    <button type="submit">💾 Save Settings</button>
                </form>
            </div>

            <!-- Paystack Configuration -->
            <div class="card">
                <h2>💳 Paystack Configuration</h2>
                <div class="settings-form">
                    <div class="setting-row">
                        <span class="setting-name">Status</span>
                        <span class="setting-value">✅ Connected</span>
                    </div>
                    <div class="setting-row">
                        <span class="setting-name">Environment</span>
                        <span class="setting-value">Live</span>
                    </div>
                    <div class="setting-row">
                        <span class="setting-name">Currency</span>
                        <span class="setting-value">NGN</span>
                    </div>
                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label>Paystack Secret Key</label>
                        <input type="password" id="paystackSecret" placeholder="sk_live_..." required>
                    </div>
                    <div class="form-group">
                        <label>Paystack Public Key</label>
                        <input type="text" id="paystackPublic" placeholder="pk_live_..." required>
                    </div>
                    <button type="button" onclick="updatePaystackKeys()">🔐 Update Paystack Keys</button>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <h2>🚀 Quick Actions</h2>
                <div class="button-group" style="flex-direction: column;">
                    <button type="button" onclick="testBackendConnection()">🔗 Test Backend Connection</button>
                    <button type="button" class="btn-secondary" onclick="exportSettings()">📥 Export Settings</button>
                    <button type="button" class="btn-secondary" onclick="refreshSettings()">🔄 Refresh Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let backendUrl = '';
        let adminKey = '';

        function handleLogin(e) {
            e.preventDefault();
            backendUrl = document.getElementById('backendUrl').value;
            adminKey = document.getElementById('adminKey').value;

            testBackendConnection();
        }

        function handleLogout() {
            backendUrl = '';
            adminKey = '';
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('show');
            showAlert('Logged out successfully', 'info');
        }

        async function testBackendConnection() {
            try {
                const res = await fetch(`${backendUrl}/api/health`);
                if (res.ok) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboard').classList.add('show');
                    await refreshSettings();
                    showAlert('Connected successfully!', 'success');
                } else {
                    showAlert('Connection failed', 'error');
                }
            } catch (err) {
                showAlert(`Error: ${err.message}`, 'error');
            }
        }

        async function refreshSettings() {
            try {
                const res = await fetch(`${backendUrl}/api/admin/settings`, {
                    headers: {
                        'x-admin-key': adminKey
                    }
                });

                if (!res.ok) throw new Error('Unauthorized');

                const data = await res.json();
                const settings = data.settings;

                // Update display
                document.getElementById('priceValue').textContent = `₦${settings.premium_monthly_price.toLocaleString()}`;
                document.getElementById('searchValue').textContent = settings.free_searches_per_day;
                document.getElementById('articlesValue').textContent = settings.articles_per_company;

                // Update form
                document.getElementById('premiumPrice').value = settings.premium_monthly_price;
                document.getElementById('freeSearues').value = settings.free_searches_per_day;
                document.getElementById('articlesPerCompany').value = settings.articles_per_company;
                document.getElementById('featuredEnabled').checked = settings.featured_listing_enabled;
                document.getElementById('reviewsEnabled').checked = settings.customer_reviews_enabled;
                document.getElementById('apiEnabled').checked = settings.api_access_enabled;

                showAlert('Settings loaded', 'info');
            } catch (err) {
                showAlert(`Error: ${err.message}`, 'error');
            }
        }

        async function handleUpdateSettings(e) {
            e.preventDefault();

            try {
                const res = await fetch(`${backendUrl}/api/admin/settings/update`, {
                    method: 'POST',
                    headers: {
                        'x-admin-key': adminKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        premium_monthly_price: parseInt(document.getElementById('premiumPrice').value),
                        free_searches_per_day: parseInt(document.getElementById('freeSearues').value),
                        articles_per_company: parseInt(document.getElementById('articlesPerCompany').value),
                        featured_listing_enabled: document.getElementById('featuredEnabled').checked,
                        customer_reviews_enabled: document.getElementById('reviewsEnabled').checked,
                        api_access_enabled: document.getElementById('apiEnabled').checked
                    })
                });

                const data = await res.json();

                if (data.success) {
                    showAlert('✅ Settings updated successfully!', 'success');
                    await refreshSettings();
                } else {
                    showAlert(`Error: ${data.message}`, 'error');
                }
            } catch (err) {
                showAlert(`Error: ${err.message}`, 'error');
            }
        }

        function updatePaystackKeys() {
            showAlert('🔐 Paystack keys update requires environment variable changes on your server', 'info');
        }

        function exportSettings() {
            const settings = {
                premiumPrice: document.getElementById('premiumPrice').value,
                freeSearches: document.getElementById('freeSearues').value,
                articlesPerCompany: document.getElementById('articlesPerCompany').value,
                featuredEnabled: document.getElementById('featuredEnabled').checked,
                reviewsEnabled: document.getElementById('reviewsEnabled').checked,
                apiEnabled: document.getElementById('apiEnabled').checked,
                exportedAt: new Date()
            };

            console.log(JSON.stringify(settings, null, 2));
            showAlert('Settings exported to console', 'info');
        }

        function showAlert(message, type) {
            const alerts = {
                'success': document.getElementById('successAlert'),
                'error': document.getElementById('errorAlert'),
                'info': document.getElementById('infoAlert')
            };

            const alert = alerts[type];
            alert.textContent = message;
            alert.classList.add('show');

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
